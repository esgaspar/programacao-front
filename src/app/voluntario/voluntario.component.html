<div class="vol-container">
<div class="vol-toolbar">
    <a mat-flat-button color="primary" (click)="novoVoluntario()" class="btn-app">
        <fa-icon [icon]="['fas', 'user-plus']"></fa-icon>
        <span>Novo voluntário</span>
    </a>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" (click)="$event.stopPropagation()" class="search-field">
        <mat-label>Buscar</mat-label>
        <input matInput type="text" [(ngModel)]="busca" (keyup.enter)="getList()" (keyup)="getList()" placeholder="Nome do voluntário">
        <button matSuffix mat-icon-button aria-label="search" (click)="getList()">
            <fa-icon [icon]="['fas', 'search']"></fa-icon>
        </button>
    </mat-form-field>
</div>

<mat-divider class="mb-3"></mat-divider>

<div class="vol-grid">
    @for (item of list(); track item.id) {
        <mat-card class="vol-card">
            @if (item.isLoading) {
                <mat-progress-bar mode="indeterminate"></mat-progress-bar>
            }
            <mat-card-header class="vol-card-header">
                <div class="vol-avatar">{{ item.nome | avatarInitials }}</div>
            </mat-card-header>
            <mat-card-content>
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Nome</mat-label>
                    <input matInput type="text" [(ngModel)]="item.nome" (keyup.enter)="salvar(item, false)"
                        (blur)="salvar(item, false)" placeholder="Nome do publicador">
                </mat-form-field>
                <mat-form-field appearance="outline" class="w-100 m-0">
                    <mat-label>Privilégios</mat-label>
                    <mat-select multiple [compareWith]="compareFn" [(ngModel)]="item.privilegioList"
                        (selectionChange)="salvar(item, false)">
                        @for (subItem of privilegioList(); track subItem.id) {
                            <mat-option [value]="subItem">{{subItem.descricao}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
            </mat-card-content>
            <mat-card-footer class="vol-card-footer">
                <button mat-icon-button class="btn-remove" (click)="removeVoluntario(item);$event.stopPropagation()">
                    <fa-icon [icon]="['fas', 'user-minus']"></fa-icon>
                </button>
            </mat-card-footer>
        </mat-card>
    }
</div>
<div class="mb-4"></div>
</div>
