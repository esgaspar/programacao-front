<div class="login-page">
    <div class="login-brand">
        <div class="brand-content">
            <div class="brand-icon-wrap">
                <fa-icon [icon]="['fas', 'people-roof']"></fa-icon>
            </div>
            <h1>Designações</h1>
            <p>Sistema de gestão de voluntários</p>
        </div>
    </div>

    <div class="login-form-panel">
        <div class="login-form-box">
            <h2>Entrar</h2>
            <p class="form-sub">Acesse sua conta para continuar</p>

            <mat-form-field class="w-100" appearance="outline">
                <mat-label>Usuário</mat-label>
                <input (keyup)="loginError = false" matInput [formControl]="usernameFormControl"
                    [errorStateMatcher]="matcher" placeholder="Usuário" (keyup.enter)="login()">
                @if (usernameFormControl.hasError('required')) {
                    <mat-error>Insira o usuário</mat-error>
                }
            </mat-form-field>

            <mat-form-field class="w-100" appearance="outline">
                <mat-label>Senha</mat-label>
                <input (keyup)="loginError = false" matInput type="password" [formControl]="passwordFormControl"
                    [errorStateMatcher]="matcher" placeholder="Senha" (keyup.enter)="login()">
                @if (passwordFormControl.hasError('required')) {
                    <mat-error>Insira a senha</mat-error>
                }
            </mat-form-field>

            @if (loginError) {
                <div class="login-error">
                    <fa-icon [icon]="['fas', 'triangle-exclamation']"></fa-icon>
                    <span>Usuário ou senha incorretos</span>
                </div>
            }

            <button mat-flat-button color="primary" class="btn-login" (click)="login()">
                Entrar
                <fa-icon [icon]="['fas', 'arrow-right']" class="ms-2"></fa-icon>
            </button>
        </div>
    </div>
</div>
