name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy no Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 89.117.32.90
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/workspace/programacao/programacao-front
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            source ~/.nvm/nvm.sh
            rm -rf .angular/cache node_modules
            npm install --legacy-peer-deps
            npm run build-prod
            cp -r dist/programacao-front/. /var/www/html/
            systemctl reload nginx
            echo "Frontend deployado com sucesso"
