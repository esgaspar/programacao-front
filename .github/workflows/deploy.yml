name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy no Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 89.117.32.90
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/workspace/programacao/programacao-front
            git pull origin main
            source ~/.nvm/nvm.sh
            rm -rf .angular/cache
            npm run build-prod
            systemctl reload nginx
            echo "Frontend deployado com sucesso"
