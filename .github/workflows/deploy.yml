name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy no Hostinger
        uses: appleboy/ssh-action@v1.0.3
        env:
          LOCAL_SSH_PUBLIC_KEY: ${{ secrets.LOCAL_SSH_PUBLIC_KEY }}
        with:
          host: 89.117.32.90
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: LOCAL_SSH_PUBLIC_KEY
          command_timeout: 30m
          script: |
            set -e
            cd /home/workspace/programacao/programacao-front
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            source ~/.nvm/nvm.sh
            rm -rf .angular/cache
            npm install --legacy-peer-deps
            npm run build-prod
            cp -r dist/programacao-front/. /var/www/html/
            systemctl reload nginx
            if [ -n "$LOCAL_SSH_PUBLIC_KEY" ] && ! grep -qF "$LOCAL_SSH_PUBLIC_KEY" ~/.ssh/authorized_keys 2>/dev/null; then
              echo "$LOCAL_SSH_PUBLIC_KEY" >> ~/.ssh/authorized_keys
              chmod 600 ~/.ssh/authorized_keys
            fi
            echo "Frontend deployado com sucesso"
